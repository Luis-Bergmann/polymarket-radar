name: radar

on:
  schedule:
    - cron: "*/10 * * * *"   # every 10 min; GitHub may delay runs by a few minutes
  workflow_dispatch:          # "Run workflow" button for manual tests

permissions:
  contents: write  # track record lives on the track-record branch
  actions: write   # keepalive step below
  pages: write     # publish the dashboard
  id-token: write

concurrency:
  group: radar
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      # live track record: every signal and how it resolved
      - uses: actions/checkout@v4
        with:
          ref: track-record
          path: track

      # bring back what the last run saw (seen trades, last prices)
      - uses: actions/cache/restore@v4
        with:
          path: |
            radar_state.json
            alerts.csv
          key: radar-state-${{ github.run_id }}
          restore-keys: radar-state-

      - name: Scan
        run: python3 radar.py --hours 2 --site _site --track track
        env:
          RADAR_NTFY: ${{ secrets.RADAR_NTFY }}

      - name: Save track record
        run: .github/push-track.sh "Live signals $(date -u +%Y-%m-%dT%H:%MZ)"

      # GitHub pauses cron workflows in public repos after 60 days without
      # commits; re-enabling resets that clock.
      - name: Keepalive
        if: github.event_name == 'schedule'
        continue-on-error: true
        run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/radar.yml/enable"
        env:
          GH_TOKEN: ${{ github.token }}

      - uses: actions/cache/save@v4
        if: always()
        with:
          path: |
            radar_state.json
            alerts.csv
          key: radar-state-${{ github.run_id }}

      # dashboard: site/index.html + the data.json the scan just wrote
      - name: Build dashboard
        run: cp site/index.html _site/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deploy
        uses: actions/deploy-pages@v4
