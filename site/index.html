<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Polymarket Radar</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📡</text></svg>">
<style>
  :root {
    --bg: #f6f7f9; --card: #fff; --text: #16181d; --muted: #6b7280; --line: #e5e7eb;
    --up: #0f8a4a; --down: #c62828; --accent: #2554d8; --alert: #b45309; --alert-bg: #fff4e5;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0f1115; --card: #171a21; --text: #e8eaee; --muted: #8b93a1; --line: #262b35;
      --up: #3ccf7f; --down: #ff6b6b; --accent: #7aa2ff; --alert: #f5a524; --alert-bg: #2a2013;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
    font: 15px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  header { position: sticky; top: 0; background: var(--bg); padding: 14px 16px 0; z-index: 1;
    border-bottom: 1px solid var(--line); }
  h1 { font-size: 18px; margin: 0; }
  #meta { color: var(--muted); font-size: 13px; margin: 2px 0 10px; }
  nav { display: flex; gap: 4px; overflow-x: auto; }
  nav button { background: none; border: 0; color: var(--muted); font: inherit; font-weight: 600;
    padding: 8px 12px; border-bottom: 2px solid transparent; cursor: pointer; white-space: nowrap; }
  nav button.on { color: var(--accent); border-color: var(--accent); }
  main { max-width: 760px; margin: 0 auto; padding: 12px 16px 40px; }
  .row { display: flex; gap: 12px; align-items: center; background: var(--card);
    border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; margin-bottom: 8px;
    color: inherit; text-decoration: none; }
  .row:hover { border-color: var(--accent); }
  .body { flex: 1; min-width: 0; }
  .q { font-weight: 600; }
  .sub { color: var(--muted); font-size: 13px; margin-top: 2px; }
  .num { text-align: right; flex-shrink: 0; font-variant-numeric: tabular-nums; }
  .ch { font-weight: 700; font-size: 17px; }
  .up { color: var(--up); } .down { color: var(--down); }
  .price { color: var(--muted); font-size: 13px; }
  .alert { background: var(--alert-bg); }
  .tag { display: inline-block; font-size: 11px; font-weight: 700; text-transform: uppercase;
    letter-spacing: .04em; padding: 1px 6px; border-radius: 4px; margin-right: 6px; }
  .tag.alert { color: var(--alert); border: 1px solid var(--alert); }
  .tag.move { color: var(--accent); border: 1px solid var(--accent); }
  .empty { color: var(--muted); text-align: center; padding: 40px 0; }
  .flow { font-size: 13px; margin-top: 4px; color: var(--muted); }
  .flow b { color: var(--text); }
  .row.hot { border-color: var(--alert); box-shadow: inset 3px 0 0 var(--alert); }
  .row.hot .flow b { color: var(--alert); }
  .tag.hot { color: var(--alert); border: 1px solid var(--alert); }
  .bar { height: 4px; border-radius: 2px; background: var(--line); margin-top: 5px; overflow: hidden; }
  .bar i { display: block; height: 100%; background: var(--alert); }
  #sort { display: flex; gap: 6px; margin-bottom: 10px; font-size: 13px; color: var(--muted); align-items: center; }
  #sort button { font: inherit; border: 1px solid var(--line); background: var(--card); color: var(--text);
    border-radius: 999px; padding: 4px 10px; cursor: pointer; }
  #sort button.on { border-color: var(--accent); color: var(--accent); font-weight: 600; }
  .hint { color: var(--muted); font-size: 12px; margin: 0 0 12px; }
  .pay { margin-top: 8px; padding-top: 8px; border-top: 1px dashed var(--line); font-size: 13px; }
  .pay .lbl { color: var(--muted); }
  .pay .side { font-weight: 700; }
  .stakes { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 4px; }
  .stake { background: var(--bg); border-radius: 6px; padding: 3px 8px; font-variant-numeric: tabular-nums; }
  .stake b { color: var(--up); }
  .stake .thin { color: var(--muted); }
  details.help { background: var(--card); border: 1px solid var(--line); border-radius: 10px;
    padding: 8px 12px; margin-bottom: 12px; font-size: 14px; }
  details.help summary { cursor: pointer; font-weight: 600; color: var(--accent); }
  details.help p { margin: 8px 0; }
  details.help .up, details.help .down { font-weight: 700; }
  .warn { color: var(--alert); font-size: 12px; margin-top: 4px; }
</style>
</head>
<body>
<header>
  <h1>📡 Polymarket Radar</h1>
  <div id="meta">loading…</div>
  <nav>
    <button data-tab="1h">1h movers</button>
    <button data-tab="24h">24h movers</button>
    <button data-tab="7d">7d movers</button>
    <button data-tab="log">Radar log</button>
  </nav>
</header>
<main id="list"></main>

<script>
let data = null;
let tab = "24h", sort = "move", helpOpen = true;
try { tab = localStorage.getItem("tab") || tab; sort = localStorage.getItem("sort") || sort;
  helpOpen = localStorage.getItem("help") !== "closed"; } catch (e) {}

// fresh wallets = <= 3 markets traded or account under 14 days old
const hot = f => f && f.fresh_pct >= 0.5 && f.fresh_usd >= 2000;

const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const pts = x => (x > 0 ? "+" : "") + (x * 100).toFixed(1);
const cents = p => p == null ? "–" : Math.round(p * 100) + "¢";
const money = v => "$" + Math.round(v).toLocaleString("en-US");
const usd = v => "$" + (v >= 1e6 ? (v / 1e6).toFixed(1) + "M" : v >= 1e3 ? Math.round(v / 1e3) + "k" : Math.round(v));
function ago(ts) {
  const m = Math.round((Date.now() / 1000 - ts) / 60);
  if (m < 1) return "just now";
  if (m < 60) return m + " min ago";
  if (m < 1440) return Math.round(m / 60) + " h ago";
  return Math.round(m / 1440) + " d ago";
}

function flowLine(f) {
  if (!f) return "";
  if (!f.usd) return `<div class="flow">No trades ≥ $100 pushing this way; the book moved without much trading.</div>`;
  const pct = Math.round(f.fresh_pct * 100);
  const who = f.fresh_wallets
    ? `<b>${pct}% from ${f.fresh_wallets} fresh wallet${f.fresh_wallets > 1 ? "s" : ""}</b>` +
      (f.fresh_wallets > 1 ? ` (biggest ${usd(f.top_fresh)})` : "")
    : "no fresh wallets";
  return `<div class="flow">Behind the move: ${usd(f.usd)} · ${who}${f.partial ? " · partial" : ""}</div>
    <div class="bar"><i style="width:${pct}%"></i></div>`;
}

const days = ts => {
  if (!ts) return "";
  const d = Math.round((ts - Date.now() / 1000) / 86400);
  return d < 1 ? " · resolves today" : ` · resolves in ${d}d`;
};

function payLine(r) {
  const p = r.payoff;
  if (!p) return "";
  const chips = p.stakes.map(x => {
    const slip = x.avg && x.avg - p.best >= 0.02 ? ` <span class="thin">avg ${cents(x.avg)}</span>` : "";
    return x.filled
      ? `<span class="stake">${money(x.stake)} → <b>+${money(x.profit)}</b>${slip}</span>`
      : `<span class="stake">${money(x.stake)} → <span class="thin">book only takes ${money(x.spent)}</span>, <b>+${money(x.profit)}</b></span>`;
  }).join("");
  // price of the side we'd buy implied by the headline YES price; a big gap means a thin, wide book
  const fair = r.price == null ? null : (r.change > 0 ? r.price : 1 - r.price);
  const warn = fair != null && p.best - fair >= 0.05
    ? `<div class="warn">Thin book: sellers ask ${cents(p.best)} vs ~${cents(fair)} fair. Real payoff is lower than the headline price suggests.</div>` : "";
  return `<div class="pay"><span class="lbl">Follow the push:</span> buy <span class="side">${esc(p.side)}</span> at ${cents(p.best)}${days(r.end)}
    <div class="stakes">${chips}</div>${warn}</div>`;
}

function movers(rows) {
  if (!rows.length) return '<div class="empty">No movers above the volume filter.</div>';
  rows = [...rows];
  if (sort === "fresh") rows.sort((a, b) => (b.flow?.fresh_usd || 0) - (a.flow?.fresh_usd || 0));
  const bar = `<div id="sort">Sort:
      <button data-sort="move" class="${sort === "move" ? "on" : ""}">Biggest move</button>
      <button data-sort="fresh" class="${sort === "fresh" ? "on" : ""}">Most fresh money</button></div>
    <details class="help"${helpOpen ? " open" : ""}>
      <summary>How to read this</summary>
      <p>Every market is a yes/no question. A <b>Yes</b> share pays <b>$1</b> if the answer is yes and
        nothing if not. Its price (0–100¢) is the crowd's guess at the chance: 20¢ ≈ 20% likely.</p>
      <p><span class="up">+9.0</span> = the Yes price rose 9¢ over this window, so people now think it is
        <b>more</b> likely. <span class="down">−9.0</span> = it fell 9¢, so <b>less</b> likely.
        "now 20¢" is today's price, i.e. today's guessed chance.</p>
      <p><b>Behind the move</b> = the money that pushed the price that way. <span class="tag hot">fresh money</span>
        = at least half of it came from fresh wallets (≤ 3 markets traded or &lt; 14 days old), the pattern insiders leave.</p>
      <p><b>Follow the push</b> = buy Yes on green rows, No on red rows. Shows your profit if it resolves that way,
        priced against the live order book after fees. If it resolves the other way you lose the stake.</p>
    </details>`;
  return bar + rows.map(r => `
    <a class="row${hot(r.flow) ? " hot" : ""}" href="${esc(r.link)}" target="_blank" rel="noopener">
      <div class="body">
        <div class="q">${hot(r.flow) ? '<span class="tag hot">fresh money</span>' : ""}${esc(r.question)}</div>
        <div class="sub">${r.event && r.event !== r.question ? esc(r.event) + " · " : ""}vol ${usd(r.volume)}</div>
        ${flowLine(r.flow)}
        ${payLine(r)}
      </div>
      <div class="num">
        <div class="ch ${r.change >= 0 ? "up" : "down"}">${pts(r.change)}</div>
        <div class="price">now ${cents(r.price)}</div>
      </div>
    </a>`).join("");
}

function log(rows) {
  if (!rows.length) return '<div class="empty">No radar alerts or big moves yet. They show up here as the scans find them.</div>';
  return rows.map(r => r.kind === "alert" ? `
    <a class="row alert" href="${esc(r.link)}" target="_blank" rel="noopener">
      <div class="body">
        <div class="q"><span class="tag alert">alert ${r.score}</span>${esc(r.market)}</div>
        <div class="sub">BUY ${esc(r.outcome)} @ ${cents(r.price)} · ${esc(r.why)}</div>
        <div class="sub">${esc(r.time)}${r.trader ? " · " + esc(r.trader) : ""}</div>
      </div>
      <div class="num"><div class="ch">${usd(r.usd)}</div></div>
    </a>` : `
    <a class="row" href="${esc(r.link)}" target="_blank" rel="noopener">
      <div class="body">
        <div class="q"><span class="tag move">move</span>${esc(r.question)}</div>
        <div class="sub">${cents(r.old)} → ${cents(r.new)} · ${ago(r.at)}</div>
      </div>
      <div class="num"><div class="ch ${r.new >= r.old ? "up" : "down"}">${pts(r.new - r.old)}</div></div>
    </a>`).join("");
}

function render() {
  document.querySelectorAll("nav button").forEach(b => b.classList.toggle("on", b.dataset.tab === tab));
  if (!data) return;
  document.getElementById("meta").textContent =
    `Updated ${ago(data.updated)} · ${data.markets.toLocaleString("en-US")} markets · change in points (¢)`;
  document.getElementById("list").innerHTML = tab === "log" ? log(data.log) : movers(data.movers[tab] || []);
  const help = document.querySelector("details.help");
  if (help) help.ontoggle = () => {
    helpOpen = help.open;
    try { localStorage.setItem("help", help.open ? "open" : "closed"); } catch (e) {}
  };
  document.querySelectorAll("#sort button").forEach(b => b.onclick = () => {
    sort = b.dataset.sort;
    try { localStorage.setItem("sort", sort); } catch (e) {}
    render();
  });
}

async function load() {
  try {
    const r = await fetch("data.json?t=" + Date.now(), { cache: "no-store" });
    data = await r.json();
  } catch (e) {
    document.getElementById("meta").textContent = "Could not load data.json";
  }
  render();
}

document.querySelectorAll("nav button").forEach(b => b.onclick = () => {
  tab = b.dataset.tab;
  try { localStorage.setItem("tab", tab); } catch (e) {}
  render();
  window.scrollTo(0, 0);
});
load();
setInterval(load, 120000);
</script>
</body>
</html>
